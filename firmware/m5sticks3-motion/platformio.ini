[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified#35903583211e1f39ca88920714525fbcd1eb714a
  M5PM1=https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
  m5stack/M5GFX@0.2.34
